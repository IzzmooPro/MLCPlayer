name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      MLC_CI: '1'
      PYTHONPATH: ${{ github.workspace }}/scripts
      PYTHONUTF8: '1'
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Classify changed files
        id: classify
        shell: pwsh
        env:
          PUSH_BASE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          $base = if ("${{ github.event_name }}" -eq "pull_request") {
            $env:PR_BASE_SHA
          } else {
            $env:PUSH_BASE_SHA
          }
          $docsOnly = $false
          if ($base -match '^[0-9a-fA-F]{40}$' -and
              $base -notmatch '^0{40}$') {
            git cat-file -e "$base^{commit}"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $files = @(
              git diff --name-only --diff-filter=ACDMRTUXB `
                $base $env:GITHUB_SHA
            )
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            if ($files.Count -gt 0) {
              $docsOnly = $true
              foreach ($file in $files) {
                $normalized = $file.Replace('\', '/')
                if (-not ($normalized.StartsWith('docs/') -or
                          $normalized.EndsWith('.md'))) {
                  $docsOnly = $false
                  break
                }
              }
            }
          }
          "base_sha=$base" >> $env:GITHUB_OUTPUT
          "docs_only=$($docsOnly.ToString().ToLowerInvariant())" `
            >> $env:GITHUB_OUTPUT

      - name: Set up Python for documentation checks
        if: steps.classify.outputs.docs_only == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.13.15'

      - name: Set up Python for full CI
        if: steps.classify.outputs.docs_only != 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.13.15'
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Install documentation-check dependencies
        if: steps.classify.outputs.docs_only == 'true'
        shell: pwsh
        env:
          MLC_CI: '0'
          PYTHONPATH: ''
        run: python -m pip install -r requirements-ci-docs.txt --disable-pip-version-check

      - name: Install locked dependencies
        if: steps.classify.outputs.docs_only != 'true'
        shell: pwsh
        run: python -m pip install -r requirements-lock.txt --disable-pip-version-check

      - name: Verify locked environment
        if: steps.classify.outputs.docs_only != 'true'
        shell: pwsh
        run: python packaging/verify_dependencies.py requirements-lock.txt

      - name: Compile Python sources
        if: steps.classify.outputs.docs_only != 'true'
        shell: pwsh
        run: python -m compileall -q main.py app tests packaging

      - name: Verify translations and whitespace
        if: steps.classify.outputs.docs_only != 'true'
        shell: pwsh
        run: |
          python packaging/extract_translations.py --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --check

      - name: Verify documentation and continuity
        if: steps.classify.outputs.docs_only == 'true'
        shell: pwsh
        env:
          BASE_SHA: ${{ steps.classify.outputs.base_sha }}
          MLC_CI: '0'
          PYTHONPATH: ''
        run: |
          python -m pytest -q --noconftest tests/test_continuity_regressions.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m json.tool docs/VERIFICATION_LEDGER.json > $null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --check $env:BASE_SHA $env:GITHUB_SHA

      - name: Run CI-safe test suite
        if: steps.classify.outputs.docs_only != 'true'
        shell: pwsh
        run: python -m pytest -q tests
