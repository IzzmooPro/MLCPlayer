name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      MLC_CI: '1'
      PYTHONPATH: ${{ github.workspace }}/scripts
      PYTHONUTF8: '1'
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13.15'
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Install locked dependencies
        shell: pwsh
        run: python -m pip install -r requirements-lock.txt --disable-pip-version-check

      - name: Verify locked environment
        shell: pwsh
        run: python packaging/verify_dependencies.py requirements-lock.txt

      - name: Compile Python sources
        shell: pwsh
        run: python -m compileall -q main.py app tests packaging

      - name: Verify translations and whitespace
        shell: pwsh
        run: |
          python packaging/extract_translations.py --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --check

      - name: Run CI-safe test suite
        shell: pwsh
        run: python -m pytest -q tests
